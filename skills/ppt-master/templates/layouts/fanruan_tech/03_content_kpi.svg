  <text x="640" y="404" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#8F99B3" text-anchor="middle">{{KPI2_TREND}}</text>
  <rect x="540" y="500" width="200" height="10" rx="5" fill="#D8EBFE"/>
  <text x="640" y="548" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#17346E" text-anchor="middle">{{KPI2_NAME}}</text>
  <text x="640" y="578" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#566280" text-anchor="middle">{{KPI2_DESC}}</text>
