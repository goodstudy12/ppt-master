  <text x="248" y="578" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#566280" text-anchor="middle">{{KPI1_DESC}}</text>
  <!-- KPI 单元二 -->
  <circle cx="640" cy="368" r="108" fill="#FFFFFF" fill-opacity="0.92"/>
  <circle cx="640" cy="368" r="108" fill="none" stroke="#DDEBFA" stroke-width="14"/>
