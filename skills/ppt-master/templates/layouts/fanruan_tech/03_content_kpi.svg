  <circle cx="1032" cy="368" r="108" fill="none" stroke="#DDEBFA" stroke-width="14"/>
  <path d="M 1032 260 A 108 108 0 1 1 924 368" fill="none" stroke="#66B3FF" stroke-width="14" stroke-linecap="round"/>
