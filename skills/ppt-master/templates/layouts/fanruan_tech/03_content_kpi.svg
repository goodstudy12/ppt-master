<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="fanruan_tech_master" data-pptx-master-name="FanRuan Tech" data-pptx-layout="content_kpi" data-pptx-layout-name="KPI Content">
  <!-- 底色 -->
  <rect id="slide-background" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="430" y="0" width="850" height="720" fill="#EEF7FF"/>
  <rect x="782" y="274" width="498" height="446" fill="#D8EBFE" fill-opacity="0.18"/>
  <rect x="0" y="0" width="660" height="280" fill="#FFFFFF" fill-opacity="0.92"/>
  <!-- 右上圆形装饰 -->
  <circle cx="1120" cy="130" r="118" fill="#66B3FF" fill-opacity="0.08"/>
