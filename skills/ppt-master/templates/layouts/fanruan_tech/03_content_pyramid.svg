<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="fanruan_tech_master" data-pptx-master-name="FanRuan Tech" data-pptx-layout="content_pyramid" data-pptx-layout-name="Pyramid Content">
  <!-- 底色 -->
  <rect id="slide-background" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="430" y="0" width="850" height="720" fill="#EEF7FF"/>
  <rect x="782" y="274" width="498" height="446" fill="#D8EBFE" fill-opacity="0.18"/>
  <rect x="0" y="0" width="660" height="280" fill="#FFFFFF" fill-opacity="0.92"/>
  <!-- 右上圆形装饰 -->
  <circle cx="1120" cy="130" r="118" fill="#66B3FF" fill-opacity="0.08"/>
  <!-- 右上 Logo 胶囊 -->
  <rect x="1016" y="28" width="208" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.92" stroke="#C7DCF7" stroke-width="1"/>
  <rect x="1016" y="28" width="208" height="52" rx="26" fill="#EEF7FF" fill-opacity="0.72"/>
  <image x="1047" y="30" width="146" height="48" href="fanruan_logo.png" preserveAspectRatio="xMidYMid meet"/>
  <!-- 标题区 -->
  <rect x="60" y="62" width="4" height="54" rx="2" fill="#3399FF"/>
  <text x="84" y="88" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="bold" fill="#035DCF">{{PAGE_TITLE}}</text>
  <text x="84" y="120" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#566280">{{PAGE_SUBTITLE}}</text>
  <rect x="84" y="138" width="176" height="4" rx="2" fill="#3399FF" fill-opacity="0.18"/>
  <rect x="84" y="138" width="86" height="4" rx="2" fill="#035DCF"/>
  <!-- 金字塔（四层，从上到下变宽，每层渐变蓝色） -->
  <!-- 装饰箭头 -->
  <polygon points="142,180 150,170 158,180" fill="#3399FF" fill-opacity="0.3"/>
  <rect x="148" y="180" width="4" height="30" rx="2" fill="#3399FF" fill-opacity="0.2"/>
  <!-- 第一层（最窄，最深蓝） -->
  <polygon points="300,216 200,216 172,276 328,276" fill="#0B76DE" fill-opacity="0.85"/>
  <text x="250" y="254" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">{{LEVEL1_LABEL}}</text>
  <!-- 第二层 -->
  <polygon points="328,284 172,284 134,356 366,356" fill="#3399FF" fill-opacity="0.75"/>
  <text x="250" y="328" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">{{LEVEL2_LABEL}}</text>
  <!-- 第三层 -->
  <polygon points="366,364 134,364 96,436 404,436" fill="#66B3FF" fill-opacity="0.70"/>
  <text x="250" y="408" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">{{LEVEL3_LABEL}}</text>
  <!-- 第四层（最宽，最浅蓝） -->
  <polygon points="404,444 96,444 60,524 440,524" fill="#99CCFF" fill-opacity="0.65"/>
  <text x="250" y="492" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">{{LEVEL4_LABEL}}</text>
  <!-- 虚线连接 + 右侧说明卡片 -->
  <!-- 连接线1 -->
  <line x1="328" y1="246" x2="540" y2="222" stroke="#3399FF" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4"/>
  <circle cx="540" cy="222" r="3" fill="#3399FF" fill-opacity="0.6"/>
  <!-- 说明卡片1 -->
  <rect x="560" y="184" width="460" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.88" stroke="#DDEBFA" stroke-width="1"/>
  <text x="584" y="214" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#17346E">{{LEVEL1_TITLE}}</text>
  <text x="584" y="242" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#566280">{{LEVEL1_DESC}}</text>
  <!-- 连接线2 -->
  <line x1="366" y1="320" x2="540" y2="314" stroke="#3399FF" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4"/>
  <circle cx="540" cy="314" r="3" fill="#3399FF" fill-opacity="0.6"/>
  <!-- 说明卡片2 -->
  <rect x="560" y="278" width="460" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.88" stroke="#DDEBFA" stroke-width="1"/>
  <text x="584" y="308" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#17346E">{{LEVEL2_TITLE}}</text>
  <text x="584" y="336" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#566280">{{LEVEL2_DESC}}</text>
  <!-- 连接线3 -->
  <line x1="404" y1="400" x2="540" y2="406" stroke="#3399FF" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4"/>
  <circle cx="540" cy="406" r="3" fill="#3399FF" fill-opacity="0.6"/>
  <!-- 说明卡片3 -->
  <rect x="560" y="372" width="460" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.88" stroke="#DDEBFA" stroke-width="1"/>
  <text x="584" y="402" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#17346E">{{LEVEL3_TITLE}}</text>
  <text x="584" y="430" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#566280">{{LEVEL3_DESC}}</text>
  <!-- 连接线4 -->
  <line x1="440" y1="484" x2="540" y2="498" stroke="#3399FF" stroke-width="1" stroke-dasharray="6,4" stroke-opacity="0.4"/>
  <circle cx="540" cy="498" r="3" fill="#3399FF" fill-opacity="0.6"/>
  <!-- 说明卡片4 -->
  <rect x="560" y="466" width="460" height="76" rx="14" fill="#FFFFFF" fill-opacity="0.88" stroke="#DDEBFA" stroke-width="1"/>
  <text x="584" y="496" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" font-weight="bold" fill="#17346E">{{LEVEL4_TITLE}}</text>
  <text x="584" y="524" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#566280">{{LEVEL4_DESC}}</text>
  <!-- 底部框架标注 + 页码 -->
  <text x="84" y="700" font-family="Arial, sans-serif" font-size="12" fill="#8F99B3" letter-spacing="1.6">FANRUAN LIGHT TECH FRAME</text>
  <rect x="1144" y="682" width="74" height="28" rx="14" fill="#035DCF" fill-opacity="0.09"/>
  <text x="1181" y="701" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#035DCF" text-anchor="middle">{{PAGE_NUMBER}}</text>
</svg>
