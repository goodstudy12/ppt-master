<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="fanruan_tech_master" data-pptx-master-name="FanRuan Tech" data-pptx-layout="content_timeline" data-pptx-layout-name="Timeline Content">
  <!-- 底色 -->
  <rect id="slide-background" width="1280" height="720" fill="#FFFFFF"/>
  <rect x="430" y="0" width="850" height="720" fill="#EEF7FF"/>
  <rect x="782" y="274" width="498" height="446" fill="#D8EBFE" fill-opacity="0.18"/>
  <rect x="0" y="0" width="660" height="280" fill="#FFFFFF" fill-opacity="0.92"/>
  <!-- 右上圆形装饰 -->
  <circle cx="1120" cy="130" r="118" fill="#66B3FF" fill-opacity="0.08"/>
  <!-- 右上 Logo 胶囊 -->
  <rect x="1016" y="28" width="208" height="52" rx="26" fill="#FFFFFF" fill-opacity="0.92" stroke="#C7DCF7" stroke-width="1"/>
  <rect x="1016" y="28" width="208" height="52" rx="26" fill="#EEF7FF" fill-opacity="0.72"/>
  <image x="1047" y="30" width="146" height="48" href="fanruan_logo.png" preserveAspectRatio="xMidYMid meet"/>
  <!-- 标题区 -->
  <rect x="60" y="62" width="4" height="54" rx="2" fill="#3399FF"/>
  <text x="84" y="88" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" font-weight="bold" fill="#035DCF">{{PAGE_TITLE}}</text>
  <text x="84" y="120" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#566280">{{PAGE_SUBTITLE}}</text>
  <rect x="84" y="138" width="176" height="4" rx="2" fill="#3399FF" fill-opacity="0.18"/>
  <rect x="84" y="138" width="86" height="4" rx="2" fill="#035DCF"/>
  <!-- 三阶段时间轴卡片 -->
  <!-- 卡片一 -->
  <rect x="56" y="200" width="360" height="420" rx="22" fill="#FFFFFF" fill-opacity="0.88" stroke="#DDEBFA" stroke-width="1"/>
  <rect x="56" y="200" width="360" height="420" rx="22" fill="#F6FAFF" fill-opacity="0.30"/>
  <!-- 图标占位 -->
  <circle cx="236" cy="310" r="60" fill="#FFFFFF" stroke="#DDEBFA" stroke-width="1"/>
  <circle cx="236" cy="310" r="46" fill="#3399FF" fill-opacity="0.06"/>
  <text x="236" y="318" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#3399FF" text-anchor="middle">{{STAGE1_ICON}}</text>
  <!-- 阶段标题 -->
  <text x="236" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#035DCF" text-anchor="middle">{{STAGE1_TITLE}}</text>
  <text x="236" y="444" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#566280" text-anchor="middle">{{STAGE1_DATE}}</text>
  <text x="236" y="480" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#8F99B3" text-anchor="middle">{{STAGE1_DESC}}</text>
  <!-- 箭头 连接器 1→2 -->
  <polygon points="426,400 448,388 448,412" fill="#3399FF" fill-opacity="0.40"/>
  <rect x="416" y="396" width="12" height="8" rx="2" fill="#3399FF" fill-opacity="0.30"/>
  <!-- 卡片二 -->
  <rect x="460" y="200" width="360" height="420" rx="22" fill="#FFFFFF" fill-opacity="0.88" stroke="#DDEBFA" stroke-width="1"/>
  <rect x="460" y="200" width="360" height="420" rx="22" fill="#F6FAFF" fill-opacity="0.30"/>
  <circle cx="640" cy="310" r="60" fill="#FFFFFF" stroke="#DDEBFA" stroke-width="1"/>
  <circle cx="640" cy="310" r="46" fill="#3399FF" fill-opacity="0.08"/>
  <text x="640" y="318" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#3399FF" text-anchor="middle">{{STAGE2_ICON}}</text>
  <text x="640" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#035DCF" text-anchor="middle">{{STAGE2_TITLE}}</text>
  <text x="640" y="444" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#566280" text-anchor="middle">{{STAGE2_DATE}}</text>
  <text x="640" y="480" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#8F99B3" text-anchor="middle">{{STAGE2_DESC}}</text>
  <!-- 箭头 连接器 2→3 -->
  <polygon points="830,400 852,388 852,412" fill="#3399FF" fill-opacity="0.40"/>
  <rect x="820" y="396" width="12" height="8" rx="2" fill="#3399FF" fill-opacity="0.30"/>
  <!-- 卡片三 -->
  <rect x="864" y="200" width="360" height="420" rx="22" fill="#FFFFFF" fill-opacity="0.88" stroke="#DDEBFA" stroke-width="1"/>
  <rect x="864" y="200" width="360" height="420" rx="22" fill="#F6FAFF" fill-opacity="0.30"/>
  <circle cx="1044" cy="310" r="60" fill="#FFFFFF" stroke="#DDEBFA" stroke-width="1"/>
  <circle cx="1044" cy="310" r="46" fill="#3399FF" fill-opacity="0.10"/>
  <text x="1044" y="318" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="18" fill="#3399FF" text-anchor="middle">{{STAGE3_ICON}}</text>
  <text x="1044" y="410" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="20" font-weight="bold" fill="#035DCF" text-anchor="middle">{{STAGE3_TITLE}}</text>
  <text x="1044" y="444" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="16" fill="#566280" text-anchor="middle">{{STAGE3_DATE}}</text>
  <text x="1044" y="480" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#8F99B3" text-anchor="middle">{{STAGE3_DESC}}</text>
  <!-- 底部框架标注 + 页码 -->
  <text x="84" y="700" font-family="Arial, sans-serif" font-size="12" fill="#8F99B3" letter-spacing="1.6">FANRUAN LIGHT TECH FRAME</text>
  <rect x="1144" y="682" width="74" height="28" rx="14" fill="#035DCF" fill-opacity="0.09"/>
  <text x="1181" y="701" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#035DCF" text-anchor="middle">{{PAGE_NUMBER}}</text>
</svg>
